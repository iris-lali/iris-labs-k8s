apiVersion: v1
kind: Pod
metadata:
  labels:
    run: secured
  name: secured
spec:
  securityContext:
    fsGroup: 3000
  containers:
  - image: nginx
    name: secured
    resources: {}
    volumeMounts:
    - mountPath: /data/app
      name: data-volume
  volumes:
  - name: data-volume
    emptyDir:
      