apiVersion: v1
items:
- apiVersion: batch/v1
  kind: CronJob
  metadata:
    name: my-job
  spec:
    concurrencyPolicy: Allow
    failedJobsHistoryLimit: 1
    jobTemplate:
      metadata:
        name: my-job
      spec:
        template:
          metadata: {}
          spec:
            containers:
            - command:
              - -c
              - echo "Current date:$(date)"
              image: busybox
              imagePullPolicy: Always
              name: my-job
    schedule: '*/1 * * * *'