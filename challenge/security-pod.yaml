apiVersion: v1
kind: Pod
metadata:
  labels:
    run: security-pod
  name: security-pod
spec:
  securityContext:
    runAsUser: 1001
    runAsGroup: 2002
  containers:
  - args:
    - sleep
    - "3600"
    image: busybox:latest
    name: security-pod
    securityContext:
      allowPrivilegeEscalation: false
