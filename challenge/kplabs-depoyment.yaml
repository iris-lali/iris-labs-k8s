apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kplabs-deployment
  name: kplabs-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kplabs-deployment
  template:
    metadata:
      labels:
        app: kplabs-deployment
    spec:
      containers:
      - image: nginx:latest
        name: nginx
  strategy:
   type: RollingUpdate
   rollingUpdate:
     maxUnavailable: 1 
     maxSurge: 1     
        