apiVersion: batch/v1
kind: CronJob
metadata:
  name: success-custom
spec:
  schedule: "*/1 * * * *"
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: pass
            image: busybox
            args:
            - ping
            - -c2
            - "google.com"
          restartPolicy: Never